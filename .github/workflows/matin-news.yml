name: matin news
on:
  schedule:
    - cron: "17 * * * *"   # every hour
  workflow_dispatch:
  push:
    paths:
      - "matin-news/fetch_news.py"
      - ".github/workflows/matin-news.yml"
permissions:
  contents: write
concurrency: matin-news
jobs:
  update:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: matin-news
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python fetch_news.py
      - name: commit news.json if changed
        run: |
          git config user.name "news-bot"
          git config user.email "news-bot@users.noreply.github.com"
          git add news.json
          git diff --cached --quiet || (git commit -m "matin-news: update news" && git pull --rebase && git push)
