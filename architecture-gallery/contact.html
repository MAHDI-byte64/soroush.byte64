<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>تماس با ما — استودیو سروش</title>
<meta name="description" content="راه‌های ارتباط با استودیو سروش و فرم درخواست همکاری.">
<meta name="theme-color" content="#f3f0ea">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;500;600&family=Noto+Naskh+Arabic:wght@400;500&family=Cormorant+Garamond:ital,wght@0,400;1,400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/style.css">
</head>
<body data-page="contact">
<main>
  <section class="page-hero wrap">
    <span class="eyebrow">تماس با ما</span>
    <h1><span class="line-reveal"><span>هر بنا با یک</span></span><span class="line-reveal"><span>گفت‌وگو آغاز می‌شود.</span></span></h1>
  </section>

  <section class="wrap">
    <div class="contact-grid">
      <div id="info" class="reveal"></div>
      <form class="form reveal" id="form" novalidate>
        <div class="field"><input id="f-name" name="name" placeholder=" " autocomplete="name" required><label for="f-name">نام و نام خانوادگی</label></div>
        <div class="field"><input id="f-email" name="email" type="email" placeholder=" " autocomplete="email" dir="ltr" required><label for="f-email">ایمیل</label></div>
        <div class="field"><input id="f-phone" name="phone" type="tel" placeholder=" " autocomplete="tel" dir="ltr"><label for="f-phone">تلفن</label></div>
        <div class="field">
          <select id="f-budget" name="budget">
            <option value="">انتخاب کنید</option>
            <option>کمتر از ۵ میلیارد تومان</option>
            <option>۵ تا ۲۰ میلیارد تومان</option>
            <option>بیش از ۲۰ میلیارد تومان</option>
          </select><label for="f-budget">بودجه تقریبی</label>
        </div>
        <fieldset class="chips" style="border:0;margin:0">
          <legend class="eyebrow" style="padding:0">نوع پروژه</legend>
          <label><input type="checkbox" name="type" value="مسکونی"><span>مسکونی</span></label>
          <label><input type="checkbox" name="type" value="تجاری و اداری"><span>تجاری و اداری</span></label>
          <label><input type="checkbox" name="type" value="فرهنگی"><span>فرهنگی</span></label>
          <label><input type="checkbox" name="type" value="معماری داخلی"><span>معماری داخلی</span></label>
          <label><input type="checkbox" name="type" value="منظر"><span>منظر</span></label>
        </fieldset>
        <div class="field full"><textarea id="f-msg" name="message" placeholder=" " required></textarea><label for="f-msg">درباره پروژه‌تان بنویسید</label></div>
        <button class="submit" type="submit">ارسال پیام <span>←</span></button>
        <p class="form-note" role="status"></p>
      </form>
    </div>

    <div class="map reveal" aria-label="موقعیت استودیو">
      <svg viewBox="0 0 1200 400" preserveAspectRatio="xMidYMid slice" aria-hidden="true">
        <g stroke="#d9d4ca" fill="none">
          <path d="M0 210 C300 190 500 230 1200 180" stroke-width="14"/>
          <path d="M640 0 L600 400" stroke-width="18"/>
          <path d="M0 80 L1200 120 M0 330 L1200 300 M200 0 L240 400 M900 0 L860 400 M420 0 L460 400 M1060 0 L1020 400" stroke-width="5"/>
          <path d="M300 0 L330 400 M760 0 L740 400 M0 140 L1200 150 M0 270 L1200 250" stroke-width="2"/>
        </g>
        <rect x="660" y="60" width="160" height="90" fill="#e3e6dc"/>
        <rect x="80" y="230" width="110" height="80" fill="#e3e6dc"/>
      </svg>
      <div class="pin">استودیو سروش<i></i></div>
    </div>
  </section>
</main>
<script src="assets/js/data.js"></script>
<script src="assets/js/art.js"></script>
<script src="assets/js/main.js"></script>
</body>
</html>
